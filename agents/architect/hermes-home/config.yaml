model:
  default: qwen3-8-27b
  provider: custom
  base_url: https://api.runinfra.ai/v1
  api_key: ${CUSTOM_API_KEY}
platforms:
  webhook:
    enabled: true
    extra:
      port: 8644
      routes:
        inbox:
          secret: 268153c0943f02a87bd48f12ae8841c6621b4728bd305340
          prompt: '{message}'
platform_toolsets:
  webhook:
    - hermes-cli
_config_version: 38
plugins:
  enabled: []
agent: {}
onboarding:
  seen:
    profile_build_offered: true

auxiliary:
  background_review:
    enabled: false  # factory policy: no runtime self-improvement; skills change via PR only
