model:
  default: stealth/ox-alpha
  provider: openrouter
platforms:
  webhook:
    enabled: true
    extra:
      port: 8644
      routes:
        inbox:
          secret: c82a157b57e254ba59c72eaafc3af3bb3997fe6f92b1b173
          prompt: '{message}'
platform_toolsets:
  webhook:
    - hermes-cli
_config_version: 38
plugins:
  enabled: []
agent: {}
onboarding:
  seen:
    profile_build_offered: true
auxiliary:
  background_review:
    enabled: false  # factory policy: no runtime self-improvement; skills change via PR only
