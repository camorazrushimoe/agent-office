name: agent-office

# Agent Office — shell factory.
# 4 Office agents (Hermes) + shared Redis bus + pre-prod network.
#
# Start:
#   cp .env.example .env && cp crew/agents.example.json crew/agents.json
#   # edit secrets / CUSTOM_API_KEY in agent config.yaml or env
#   docker compose up -d
#
# Ping:
#   python3 crew/crew-send.py scrum-master "hello"
#   python3 crew/office-log.py --follow
#
# Host ports (default): Redis 6380, agents 8751–8754
# (chosen to avoid clashing with a local dev-crew on 6379 / 8651–8654)

services:
  # Always-on lifecycle supervisor: idle reaper (40m) + wake listener.
  # The ONLY component allowed to start/stop registered agent containers.
  factory-control:
    build:
      context: .
      dockerfile: Dockerfile.factory-control
    image: agent-office-factory-control:latest
    container_name: agent-office-factory-control
    restart: unless-stopped
    depends_on:
      shared-memory:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/opt/repo:ro                       # agents' logs for activity signal
    environment:
      - IDLE_TIMEOUT_S=${IDLE_TIMEOUT_S:-2400}
      - CHECK_INTERVAL=${CHECK_INTERVAL:-120}
      - WAKE_TIMEOUT_S=${WAKE_TIMEOUT_S:-90}
      - OFFICE_BUS_URL=redis://shared-memory:6379
    networks: [crew]

  shared-memory:
    image: redis:7-alpine
    container_name: agent-office-shared-memory
    restart: unless-stopped
    networks: [crew, preprod]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  architect:
    image: nousresearch/hermes-agent:latest
    container_name: agent-office-architect
    restart: unless-stopped
    networks: [crew]
    depends_on:
      shared-memory:
        condition: service_healthy
    volumes:
      - ./agents/architect/hermes-home:/opt/data
      - ./agents/render_config.py:/opt/render_config.py:ro
      - .:/opt/repo:ro
      - ./agents/architect/skills:/opt/data/skills/agent-office:ro
      - ./crew:/opt/crew:ro
      - ./docs:/opt/docs:ro
    environment:
      - HERMES_UID=${HERMES_UID:-501}
      - HERMES_GID=${HERMES_GID:-20}
      - HERMES_WRITE_SAFE_ROOT=/opt/data
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - CUSTOM_API_KEY=${CUSTOM_API_KEY:-}
      - LINEAR_API_KEY=${LINEAR_API_KEY:-}
      - OPENROUTER_API_KEY=${CUSTOM_API_KEY:-}
      - DOOR_SECRET_ARCHITECT=${DOOR_SECRET_ARCHITECT:-}
      - DOOR_SECRET=${DOOR_SECRET_ARCHITECT:-}
      - OFFICE_BUS_URL=redis://shared-memory:6379
    ports:
      - "8751:8644"
    command: ["sh", "-c", "python3 /opt/render_config.py && exec hermes gateway run"]

  staff-engineer:
    image: agent-office-agent:local
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: agent-office-staff-engineer
    restart: unless-stopped
    networks: [crew, preprod]
    depends_on:
      shared-memory:
        condition: service_healthy
    volumes:
      - ./agents/staff-engineer/hermes-home:/opt/data
      - ./agents/render_config.py:/opt/render_config.py:ro
      - .:/opt/repo:ro
      - ./agents/staff-engineer/skills:/opt/data/skills/agent-office:ro
      - ./crew:/opt/crew:ro
      - ./docs:/opt/docs:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - HERMES_UID=${HERMES_UID:-501}
      - HERMES_GID=${HERMES_GID:-20}
      - HERMES_WRITE_SAFE_ROOT=/opt/data
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - CUSTOM_API_KEY=${CUSTOM_API_KEY:-}
      - LINEAR_API_KEY=${LINEAR_API_KEY:-}
      - OPENROUTER_API_KEY=${CUSTOM_API_KEY:-}
      - DOOR_SECRET_STAFF_ENGINEER=${DOOR_SECRET_STAFF_ENGINEER:-}
      - DOOR_SECRET=${DOOR_SECRET_STAFF_ENGINEER:-}
      - OFFICE_BUS_URL=redis://shared-memory:6379
    ports:
      - "8752:8644"
    command: ["sh", "-c", "python3 /opt/render_config.py && exec hermes gateway run"]

  scrum-master:
    image: nousresearch/hermes-agent:latest
    container_name: agent-office-scrum-master
    restart: unless-stopped
    networks: [crew]
    depends_on:
      shared-memory:
        condition: service_healthy
    volumes:
      - ./agents/scrum-master/hermes-home:/opt/data
      - ./agents/render_config.py:/opt/render_config.py:ro
      - .:/opt/repo:ro
      - ./agents/scrum-master/skills:/opt/data/skills/agent-office:ro
      - ./crew:/opt/crew:ro
      - ./docs:/opt/docs:ro
      - ./config:/opt/config:ro
    environment:
      - HERMES_UID=${HERMES_UID:-501}
      - HERMES_GID=${HERMES_GID:-20}
      - HERMES_WRITE_SAFE_ROOT=/opt/data
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - CUSTOM_API_KEY=${CUSTOM_API_KEY:-}
      - LINEAR_API_KEY=${LINEAR_API_KEY:-}
      - OPENROUTER_API_KEY=${CUSTOM_API_KEY:-}
      - DOOR_SECRET_SCRUM_MASTER=${DOOR_SECRET_SCRUM_MASTER:-}
      - DOOR_SECRET=${DOOR_SECRET_SCRUM_MASTER:-}
      - OFFICE_BUS_URL=redis://shared-memory:6379
    ports:
      - "8753:8644"
    command: ["sh", "-c", "python3 /opt/render_config.py && exec hermes gateway run"]

  super-devops:
    image: agent-office-agent:local
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: agent-office-super-devops
    restart: unless-stopped
    networks: [crew, preprod]
    depends_on:
      shared-memory:
        condition: service_healthy
    volumes:
      - ./agents/super-devops/hermes-home:/opt/data
      - ./agents/render_config.py:/opt/render_config.py:ro
      - .:/opt/repo:ro
      - ./agents/super-devops/skills:/opt/data/skills/agent-office:ro
      - ./crew:/opt/crew:ro
      - ./docs:/opt/docs:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - HERMES_UID=${HERMES_UID:-501}
      - HERMES_GID=${HERMES_GID:-20}
      - HERMES_WRITE_SAFE_ROOT=/opt/data
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - CUSTOM_API_KEY=${CUSTOM_API_KEY:-}
      - LINEAR_API_KEY=${LINEAR_API_KEY:-}
      - OPENROUTER_API_KEY=${CUSTOM_API_KEY:-}
      - DOOR_SECRET_SUPER_DEVOPS=${DOOR_SECRET_SUPER_DEVOPS:-}
      - DOOR_SECRET=${DOOR_SECRET_SUPER_DEVOPS:-}
      - OFFICE_BUS_URL=redis://shared-memory:6379
    ports:
      - "8754:8644"
    command: ["sh", "-c", "python3 /opt/render_config.py && exec hermes gateway run"]

networks:
  crew:
    driver: bridge
    name: agent-office-crew
  preprod:
    driver: bridge
    name: agent-office-preprod
