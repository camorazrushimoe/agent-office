name: dev-1

# dev-1 — first Dev team instance (from the dev-crew template), Office-attached.
#
# Contract: ../OFFICE-ATTACH.md + dev-crew/docs/office-template.md
# - No local Redis: agents use OFFICE_BUS_URL (Office shared bus)
# - Agents restart:"no" — lifecycle controller owns start/stop
# - Doors: POST /webhooks/inbox on 8644, host ports 8661–8664
# - Private dev-cluster networks are team-owned (dev-env / staging-env)

networks:
  agent-office:
    external: true
    name: agent-office
  dev-env:
    name: dev-1-dev-env
  staging-env:
    name: dev-1-staging-env

services:
  developer:
    image: nousresearch/hermes-agent:latest
    container_name: dev-1-developer
    restart: "no"
    networks: [agent-office, dev-env, staging-env]
    volumes:
      - ./home/developer:/opt/data
      - ./secrets:/opt/secrets:ro
      - ./workspace:/workspace
      - ./crew:/opt/crew:ro
      - ../../office:/opt/office-lib:ro
    environment:
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      - HERMES_WRITE_SAFE_ROOT=/opt/data:/workspace
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - DOOR_SECRET=${DOOR_SECRET_DEVELOPER:-}
      - OFFICE_BUS_URL=redis://shared-memory:6379
      - TEAM_NAME=dev-1
    ports:
      - "127.0.0.1:8661:8644"
    command: ["sh", "-c", "python3 /opt/crew/render_config.py && exec hermes gateway run"]

  qa:
    image: nousresearch/hermes-agent:latest
    container_name: dev-1-qa
    restart: "no"
    networks: [agent-office, dev-env]
    volumes:
      - ./home/qa:/opt/data
      - ./secrets:/opt/secrets:ro
      - ./workspace:/workspace
      - ./crew:/opt/crew:ro
      - ../../office:/opt/office-lib:ro
    environment:
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      - HERMES_WRITE_SAFE_ROOT=/opt/data:/workspace
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - DOOR_SECRET=${DOOR_SECRET_QA:-}
      - OFFICE_BUS_URL=redis://shared-memory:6379
      - TEAM_NAME=dev-1
    ports:
      - "127.0.0.1:8662:8644"
    command: ["sh", "-c", "python3 /opt/crew/render_config.py && exec hermes gateway run"]

  tech-pm:
    image: nousresearch/hermes-agent:latest
    container_name: dev-1-tech-pm
    restart: "no"
    networks: [agent-office]
    volumes:
      - ./home/tech-pm:/opt/data
      - ./secrets:/opt/secrets:ro
      - ./workspace:/workspace:ro
      - ./crew:/opt/crew:ro
      - ../../office:/opt/office-lib:ro
    environment:
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      - HERMES_WRITE_SAFE_ROOT=/opt/data:/workspace
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - DOOR_SECRET=${DOOR_SECRET_TECH_PM:-}
      - OFFICE_BUS_URL=redis://shared-memory:6379
      - TEAM_NAME=dev-1
    ports:
      - "127.0.0.1:8663:8644"
    command: ["sh", "-c", "python3 /opt/crew/render_config.py && exec hermes gateway run"]

  devops:
    image: nousresearch/hermes-agent:latest
    container_name: dev-1-devops
    restart: "no"
    networks: [agent-office, staging-env]
    volumes:
      - ./home/devops:/opt/data
      - ./secrets:/opt/secrets:ro
      - ./workspace:/workspace
      - ./crew:/opt/crew:ro
      - ../../office:/opt/office-lib:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      - HERMES_WRITE_SAFE_ROOT=/opt/data:/workspace
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - DOOR_SECRET=${DOOR_SECRET_DEVOPS:-}
      - OFFICE_BUS_URL=redis://shared-memory:6379
      - TEAM_NAME=dev-1
    ports:
      - "127.0.0.1:8664:8644"
    command: ["sh", "-c", "python3 /opt/crew/render_config.py && exec hermes gateway run"]
