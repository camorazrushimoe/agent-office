name: dev-1

# dev-1 — first Dev team instance (from the dev-crew template), Office-attached.
#
# Contract: ../OFFICE-ATTACH.md + dev-crew/docs/office-template.md
# - No local Redis: agents use OFFICE_BUS_URL (Office shared bus)
# - Agents restart:"no" — lifecycle controller owns start/stop
# - Doors: POST /webhooks/inbox on 8644, host ports 8661–8664
# - Private dev-cluster networks are team-owned (dev-env / staging-env)
# - Credentials resolved from the office root tokens/tokens.yaml (single source)

networks:
  agent-office:
    external: true
    name: agent-office-crew
  dev-env:
    name: dev-1-dev-env
  staging-env:
    name: dev-1-staging-env

services:
  developer:
    image: nousresearch/hermes-agent:latest
    container_name: dev-1-developer
    restart: "no"
    networks: [agent-office, dev-env, staging-env]
    volumes:
      - ./home/developer:/opt/data
      - ./skills/developer:/opt/data/skills/dev-crew:ro
      - ./workspace:/workspace
      - ./crew:/opt/crew:ro
      - ../../crew/crew-send.py:/opt/crew/crew-send.py:ro
      - ../../office:/opt/office-lib:ro
      - ../../tokens:/opt/tokens:ro
      - ../../docs:/opt/docs:ro
    environment:
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      - HERMES_WRITE_SAFE_ROOT=/opt/data:/workspace
      - TOKENS_FILE=/opt/tokens/tokens.yaml
      - FACTORY_NAME=dev-crew
      - TEAM_NAME=dev-1
      - AGENT_ID=developer
      - OFFICE_AGENTS=architect,staff-engineer,scrum-master,super-devops,research-lead,research-engineer,evaluation,technical-product-manager,product-researcher,system-domain-analyst,adversarial-reviewer,developer,tech-pm,qa,devops
      - OFFICE_BUS_URL=redis://shared-memory:6379
    ports:
      - "127.0.0.1:8661:8644"
    command: ["python3", "/opt/office-lib/render_config.py"]

  qa:
    image: nousresearch/hermes-agent:latest
    container_name: dev-1-qa
    restart: "no"
    networks: [agent-office, dev-env]
    volumes:
      - ./home/qa:/opt/data
      - ./skills/qa:/opt/data/skills/dev-crew:ro
      - ./workspace:/workspace
      - ./crew:/opt/crew:ro
      - ../../crew/crew-send.py:/opt/crew/crew-send.py:ro
      - ../../office:/opt/office-lib:ro
      - ../../tokens:/opt/tokens:ro
      - ../../docs:/opt/docs:ro
    environment:
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      - HERMES_WRITE_SAFE_ROOT=/opt/data:/workspace
      - TOKENS_FILE=/opt/tokens/tokens.yaml
      - FACTORY_NAME=dev-crew
      - TEAM_NAME=dev-1
      - AGENT_ID=qa
      - OFFICE_AGENTS=architect,staff-engineer,scrum-master,super-devops,research-lead,research-engineer,evaluation,technical-product-manager,product-researcher,system-domain-analyst,adversarial-reviewer,developer,tech-pm,qa,devops
      - OFFICE_BUS_URL=redis://shared-memory:6379
    ports:
      - "127.0.0.1:8662:8644"
    command: ["python3", "/opt/office-lib/render_config.py"]

  tech-pm:
    image: nousresearch/hermes-agent:latest
    container_name: dev-1-tech-pm
    restart: "no"
    networks: [agent-office]
    volumes:
      - ./home/tech-pm:/opt/data
      - ./skills/tech-pm:/opt/data/skills/dev-crew:ro
      - ./workspace:/workspace:ro
      - ./crew:/opt/crew:ro
      - ../../crew/crew-send.py:/opt/crew/crew-send.py:ro
      - ../../office:/opt/office-lib:ro
      - ../../tokens:/opt/tokens:ro
      - ../../docs:/opt/docs:ro
    environment:
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      - HERMES_WRITE_SAFE_ROOT=/opt/data:/workspace
      - TOKENS_FILE=/opt/tokens/tokens.yaml
      - FACTORY_NAME=dev-crew
      - TEAM_NAME=dev-1
      - AGENT_ID=tech-pm
      - OFFICE_AGENTS=architect,staff-engineer,scrum-master,super-devops,research-lead,research-engineer,evaluation,technical-product-manager,product-researcher,system-domain-analyst,adversarial-reviewer,developer,tech-pm,qa,devops
      - OFFICE_BUS_URL=redis://shared-memory:6379
    ports:
      - "127.0.0.1:8663:8644"
    command: ["python3", "/opt/office-lib/render_config.py"]

  devops:
    image: nousresearch/hermes-agent:latest
    container_name: dev-1-devops
    restart: "no"
    networks: [agent-office, staging-env]
    volumes:
      - ./home/devops:/opt/data
      - ./skills/devops:/opt/data/skills/dev-crew:ro
      - ./workspace:/workspace
      - ./crew:/opt/crew:ro
      - ../../crew/crew-send.py:/opt/crew/crew-send.py:ro
      - ../../office:/opt/office-lib:ro
      - ../../tokens:/opt/tokens:ro
      - ../../docs:/opt/docs:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      - HERMES_WRITE_SAFE_ROOT=/opt/data:/workspace
      - TOKENS_FILE=/opt/tokens/tokens.yaml
      - FACTORY_NAME=dev-crew
      - TEAM_NAME=dev-1
      - AGENT_ID=devops
      - OFFICE_AGENTS=architect,staff-engineer,scrum-master,super-devops,research-lead,research-engineer,evaluation,technical-product-manager,product-researcher,system-domain-analyst,adversarial-reviewer,developer,tech-pm,qa,devops
      - OFFICE_BUS_URL=redis://shared-memory:6379
    ports:
      - "127.0.0.1:8664:8644"
    command: ["python3", "/opt/office-lib/render_config.py"]
