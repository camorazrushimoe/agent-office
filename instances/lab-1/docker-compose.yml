name: lab-1

# lab-1 — lab team instance (template: lab-crew), Office-attached.
#
# Contract: OFFICE-ATTACH.md + template docs/office-template.md
# - No local Redis: agents use OFFICE_BUS_URL (Office shared bus)
# - Agents restart:"no" — lifecycle controller owns start/stop
# - Doors: POST /webhooks/inbox on 8644, host ports see below
# - Credentials resolved from the office root tokens/tokens.yaml (single source)

networks:
  agent-office:
    external: true
    name: agent-office-crew

services:
  research-lead:
    image: nousresearch/hermes-agent:latest
    container_name: lab-1-research-lead
    restart: "no"
    networks: [agent-office]
    volumes:
      - ./home/research-lead:/opt/data
      - ./skills/research-lead:/opt/data/skills/lab-crew:ro
      - ./workspace:/workspace
      - ./crew:/opt/crew:ro
      - ../../office:/opt/office-lib:ro
      - ../../tokens:/opt/tokens:ro
      - ../../docs:/opt/docs:ro
    environment:
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      - HERMES_WRITE_SAFE_ROOT=/opt/data:/workspace
      - TOKENS_FILE=/opt/tokens/tokens.yaml
      - FACTORY_NAME=lab-crew
      - TEAM_NAME=lab-1
      - AGENT_ID=research-lead
      - OFFICE_AGENTS=architect,staff-engineer,scrum-master,super-devops,research-lead,research-engineer,evaluation,technical-product-manager,product-researcher,system-domain-analyst,adversarial-reviewer,developer,tech-pm,qa,devops
      - OFFICE_BUS_URL=redis://shared-memory:6379
    ports:
      - "127.0.0.1:8671:8644"
    command: ["python3", "/opt/office-lib/render_config.py"]

  research-engineer:
    image: nousresearch/hermes-agent:latest
    container_name: lab-1-research-engineer
    restart: "no"
    networks: [agent-office]
    volumes:
      - ./home/research-engineer:/opt/data
      - ./skills/research-engineer:/opt/data/skills/lab-crew:ro
      - ./workspace:/workspace
      - ./crew:/opt/crew:ro
      - ../../office:/opt/office-lib:ro
      - ../../tokens:/opt/tokens:ro
      - ../../docs:/opt/docs:ro
    environment:
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      - HERMES_WRITE_SAFE_ROOT=/opt/data:/workspace
      - TOKENS_FILE=/opt/tokens/tokens.yaml
      - FACTORY_NAME=lab-crew
      - TEAM_NAME=lab-1
      - AGENT_ID=research-engineer
      - OFFICE_AGENTS=architect,staff-engineer,scrum-master,super-devops,research-lead,research-engineer,evaluation,technical-product-manager,product-researcher,system-domain-analyst,adversarial-reviewer,developer,tech-pm,qa,devops
      - OFFICE_BUS_URL=redis://shared-memory:6379
    ports:
      - "127.0.0.1:8672:8644"
    command: ["python3", "/opt/office-lib/render_config.py"]

  evaluation:
    image: nousresearch/hermes-agent:latest
    container_name: lab-1-evaluation
    restart: "no"
    networks: [agent-office]
    volumes:
      - ./home/evaluation:/opt/data
      - ./skills/evaluation:/opt/data/skills/lab-crew:ro
      - ./workspace:/workspace:ro
      - ./crew:/opt/crew:ro
      - ../../office:/opt/office-lib:ro
      - ../../tokens:/opt/tokens:ro
      - ../../docs:/opt/docs:ro
    environment:
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      - HERMES_WRITE_SAFE_ROOT=/opt/data:/workspace
      - TOKENS_FILE=/opt/tokens/tokens.yaml
      - FACTORY_NAME=lab-crew
      - TEAM_NAME=lab-1
      - AGENT_ID=evaluation
      - OFFICE_AGENTS=architect,staff-engineer,scrum-master,super-devops,research-lead,research-engineer,evaluation,technical-product-manager,product-researcher,system-domain-analyst,adversarial-reviewer,developer,tech-pm,qa,devops
      - OFFICE_BUS_URL=redis://shared-memory:6379
    ports:
      - "127.0.0.1:8673:8644"
    command: ["python3", "/opt/office-lib/render_config.py"]
